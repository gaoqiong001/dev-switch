name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 阶段 1：构建 + 收集资产 ──────────────────────────────────
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend deps
        run: npm ci

      # 规范化签名密钥（Tauri v2）：把 secret 归一为两行 .key 文件 → base64 整文件 → TAURI_SIGNING_PRIVATE_KEY。
      # v2 CLI 读 TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD（GitHub secrets 现名）。
      # 注意：本密钥有密码保护，密码 secret 缺失则直接失败（否则 tauri 报 "Wrong password"）。
      - name: Prepare signing key
        shell: bash
        run: |
          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$RAW" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY 为空：请先在 GitHub Secrets 设置私钥（.key 文件内容）" >&2
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          # 统一归一为两行文件格式
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ 原始两行密钥文件"
          elif DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
            echo "✅ base64 包裹密钥已解码为两行"
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
            printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
            echo "✅ 单行 base64 已构造为两行"
          else
            echo "❌ 密钥格式无法识别" >&2
            exit 1
          fi

          KEY_B64=$(base64 < "$KEY_PATH" | tr -d '\r\n')
          if [ -z "$KEY_B64" ]; then
            echo "❌ 无法生成密钥 base64 内容" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_B64" >> "$GITHUB_ENV"

          PWD="${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}"
          if [ -z "$PWD" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY_PASSWORD 为空：签名密钥有密码，必须设置" >&2
            exit 1
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PWD" >> "$GITHUB_ENV"
          echo "✅ Signing key prepared"

      # 参考 cc-switch：直接调 tauri CLI 构建（不用 tauri-action），
      # 然后手动收集 .msi + .msi.sig + .exe 到 release-assets/ 目录。
      # Tauri v2 直接签名 .msi（产出 .msi.sig），latest.json 指向 .msi。
      - name: Build Tauri app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri build

          # 收集资产
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ github.ref_name }}"
          $targetRoot = 'src-tauri/target/release'
          $base = "Dev-Switch-$VERSION-Windows-x86_64"

          # ① MSI 安装包 + .msi.sig（updater 使用签名后的 .msi）
          $msi = Get-ChildItem -Path "$targetRoot/bundle/msi" -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) { Write-Error "No MSI installer found"; exit 1 }
          Copy-Item $msi.FullName "release-assets/$base.msi"
          Write-Host "✅ $base.msi"

          $sigPath = "$($msi.FullName).sig"
          if (Test-Path $sigPath) {
            Copy-Item $sigPath "release-assets/$base.msi.sig"
            Write-Host "✅ $base.msi.sig ($((Get-Item $sigPath).Length) bytes)"
          } else {
            Write-Error ".msi.sig not generated — signing failed"; exit 1
          }

          # ② NSIS exe（供用户手动下载，不参与 updater）
          $nsis = Get-ChildItem -Path "$targetRoot/bundle/nsis" -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nsis) {
            Copy-Item $nsis.FullName "release-assets/Dev-Switch-$VERSION-Windows-x86_64-setup.exe"
            Write-Host "✅ setup.exe"
          } else {
            Write-Warning "⚠️ No NSIS installer found"
          }

          # 列出所有资产
          Write-Host "`nrelease-assets:"
          Get-ChildItem -Path "release-assets" -Recurse | ForEach-Object {
            Write-Host "  $($_.Name)  ($($_.Length) bytes)"
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  # ── 阶段 2：创建 GitHub Release + 上传安装包 ─────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      # 如果 Release 已存在（如 tauri-action 之前创建的），先删除
      - name: Delete existing release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "$GITHUB_REPOSITORY" || true
          # 同时删除远端 tag（softprops 会重新创建）
          git push origin --delete "${{ github.ref_name }}" 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dev Switch ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # Dev Switch ${{ github.ref_name }}

            > **Tauri v2 升级版** — 迁移到 Tauri v2，并让「静默自动更新」真正端到端跑通：CI 直接签名 `.msi`（产出 `.msi.sig`），`latest.json` 指向签名后的 `.msi`，应用内「检查更新 / 自动安装」从此可验证并安装真实 Release。

            **[中文版 →](https://github.com/gaoqiong001/dev-switch/blob/${{ github.ref_name }}/docs/release-notes/${{ github.ref_name }}-zh.md)** | **[Changelog](https://github.com/gaoqiong001/dev-switch/blob/${{ github.ref_name }}/CHANGELOG.md)**

            ---

            ## What's New in v0.2.0

            - **Migrated to Tauri v2** — backend upgraded from Tauri v1.8.3 to v2.8.0 (same foundation as the reference app cc-switch); config rewritten to the v2 schema; added `capabilities/` for IPC permissions.
            - **Auto-update now actually works** — v2 signs the `.msi` directly (`.msi.sig`); release assets are now `.msi` + `.msi.sig` + `-setup.exe` + a `latest.json` with a real signature/URL.
            - **Frontend deps upgraded** — `@tauri-apps/api` / `@tauri-apps/cli` to 2.x; `invoke` moved to `@tauri-apps/api/core`.
            - **Fixed download progress** — progress events now report cumulative bytes, so the progress bar no longer jumps around.

            ---

            ## Overview

            Dev Switch is a local development-environment detection app. It scans the machine for installed runtimes and tools, reports clean version numbers and install paths, and opens the matching install/uninstall guide per platform. Detection results are cached in a bundled SQLite database, so subsequent launches are instant until you hit **Refresh**.

            **Release date**: 2026-08-10

            **Change size**: Tauri v1 → v2 upgrade · 13 files · +2,019 / −1,389 lines

            ---

            ## Upgrade Notes

            - **Already on v0.1.0?** The built-in updater detects v0.2.0 on next launch and auto-installs it (if **Settings → Startup → Auto-download and install updates** is enabled). No database migration — the schema is unchanged.
            - **Fresh install** — grab the `.exe` or `.msi` from the **Assets** section below.

            ---

            ## Download & Install

            Windows:

            - `.exe` (NSIS installer)
            - `.msi` (MSI installer) — recommended for auto-update support

            > No console windows pop up during detection on Windows.

            ---

            ## License

            MIT © Gao Qiong
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 阶段 3：生成 latest.json + 上传到 Release ────────────────
  # 参考 cc-switch 的 assemble-latest-json job。
  # Tauri updater 读取此文件来判断是否有新版本、下载地址和签名。
  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Install gh CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gh
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          # 遍历 .sig 文件，构建 platform 映射
          WIN_URL=""; WIN_SIG=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            fname=$(basename "${sig%.sig}")
            url="$BASE_URL/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *-Windows-x86_64.msi)
                WIN_URL="$url"; WIN_SIG="$sig_content";;
            esac
          done

          # 构造 latest.json
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Dev Switch $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              }
            }
          }
          EOF

          # 清理 JSON 中的缩进（去掉每行前导空格）
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('latest.json','utf8');
            const cleaned = raw.split('\n').map(l => l.replace(/^          /,'')).join('\n');
            fs.writeFileSync('latest.json', cleaned);
          "

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "✅ latest.json uploaded"
