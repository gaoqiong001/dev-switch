name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend deps
        run: npm ci

      # tauri-action@v0 对应 Tauri v1。tauri build 时注入签名私钥，
      # bundler 自动生成 .sig 与 latest.json，随 bundle/ 全部产物上传到 Release。
      - name: Build app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 两个命名体系都设：TAURI_SIGNING_PRIVATE_KEY 给 tauri-action/bundler，
          # TAURI_PRIVATE_KEY 给 tauri signer CLI（同值）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dev Switch ${{ github.ref_name }}'
          releaseBody: |
            # Dev Switch ${{ github.ref_name }}

            > 一键检测本地开发环境：19 种编程语言、50+ 种开发工具、系统与网络信息，附带各系统的安装/卸载指引，结果缓存在 SQLite 中，后续启动即时返回。
            >
            > Detect your local dev environment in one click: 19 languages, 50+ tools, system & network info, per-OS install guides — cached in SQLite for instant launches.

            ## 📝 Release Notes

            **English**: [docs/release-notes/${{ github.ref_name }}-en.md](docs/release-notes/${{ github.ref_name }}-en.md)

            **中文**: [docs/release-notes/${{ github.ref_name }}-zh.md](docs/release-notes/${{ github.ref_name }}-zh.md)

            **Changelog**: [CHANGELOG.md](CHANGELOG.md)
          releaseDraft: false
          prerelease: false
          # nsis + msi；v1 updater 在 Windows 认 .msi.zip，latest.json 的 windows-x86_64 默认指向它
          args: --bundles nsis,msi
