name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── 阶段 1：构建 + 收集资产 ──────────────────────────────────
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend deps
        run: npm ci

      # 参考 cc-switch：处理密钥格式，写入文件供 Tauri CLI 读取。
      # Tauri CLI 支持两种方式：
      #   1. TAURI_PRIVATE_KEY = 密钥文件路径
      #   2. TAURI_PRIVATE_KEY = 完整两行密钥内容
      # 这里采用方式 1（写文件路径），最可靠。
      - name: Prepare signing key
        shell: bash
        run: |
          RAW="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$RAW" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is empty" >&2
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"

          # 情况 1：已是两行格式（以 "untrusted comment:" 开头）
          if echo "$RAW" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$RAW" > "$KEY_PATH"
            echo "✅ Raw two-line key"
          # 情况 2：base64 编码的两行文件（解码后以 "untrusted comment:" 开头）
          elif DECODED=$(printf '%s' "$RAW" | (base64 --decode 2>/dev/null || base64 -D 2>/dev/null)) \
               && echo "$DECODED" | head -n1 | grep -q '^untrusted comment:'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
            echo "✅ Base64-wrapped key decoded"
          # 情况 3：单行 base64（纯 Base64 字符串）→ 构造两行文件
          elif echo "$RAW" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            ONE=$(printf '%s' "$RAW" | tr -d '\r\n')
            printf '%s\n%s\n' "untrusted comment: tauri signing key" "$ONE" > "$KEY_PATH"
            echo "✅ Single-line base64 wrapped to two-line file"
          else
            echo "❌ Unrecognized key format" >&2
            echo "Key starts with: $(echo "$RAW" | head -c 20)..." >&2
            exit 1
          fi

          echo "Key file: $KEY_PATH"
          head -1 "$KEY_PATH" | cut -c1-40
          echo "..."
          wc -l "$KEY_PATH"

          # 注入文件路径（Tauri CLI 读 TAURI_PRIVATE_KEY 环境变量）
          echo "TAURI_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" ]; then
            echo "TAURI_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi
          echo "✅ Signing key prepared at $KEY_PATH"

      # 参考 cc-switch：直接调 tauri CLI 构建（不用 tauri-action），
      # 然后手动收集 .msi + .sig 到 release-assets/ 目录。
      - name: Build Tauri app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run tauri build -- --bundles msi,nsis,updater

          # 收集资产
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ github.ref_name }}"
          $targetRoot = 'src-tauri/target/release'

          # .msi 安装包（供用户下载）
          $msi = Get-ChildItem -Path "$targetRoot/bundle/msi" -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $msi) {
            $dest = "Dev.Switch_${VERSION}_x64.msi"
            Copy-Item $msi.FullName (Join-Path "release-assets" $dest)
            Write-Host "✅ MSI copied: $dest"
          } else {
            Write-Warning "⚠️ No MSI installer found"
          }

          # .exe NSIS 安装包（供用户下载）
          $nsis = Get-ChildItem -Path "$targetRoot/bundle/nsis" -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nsis) {
            $dest = "Dev.Switch_${VERSION}_x64-setup.exe"
            Copy-Item $nsis.FullName (Join-Path "release-assets" $dest)
            Write-Host "✅ NSIS copied: $dest"
          } else {
            Write-Warning "⚠️ No NSIS installer found"
          }

          # updater 产物：.msi.zip + .msi.zip.sig（供 updater 使用）
          # Tauri v1 的 updater bundle 在 bundle/updater/ 下生成
          $updaterDir = "$targetRoot/bundle/updater"
          if (Test-Path $updaterDir) {
            Get-ChildItem -Path $updaterDir -Recurse | ForEach-Object {
              Copy-Item $_.FullName (Join-Path "release-assets" $_.Name)
              Write-Host "✅ Updater artifact copied: $($_.Name)  ($($_.Length) bytes)"
            }
          } else {
            Write-Warning "⚠️ No updater bundle directory found"
            # 兜底：在 bundle/ 全局搜索 .sig 文件
            Get-ChildItem -Path "$targetRoot/bundle" -Recurse -Include *.sig -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName (Join-Path "release-assets" $_.Name)
              Write-Host "✅ Signature found elsewhere: $($_.Name)"
            }
          }

          # 列出所有资产
          Write-Host "`nrelease-assets:"
          Get-ChildItem -Path "release-assets" -Recurse | ForEach-Object {
            Write-Host "  $($_.Name)  ($($_.Length) bytes)"
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  # ── 阶段 2：创建 GitHub Release + 上传安装包 ─────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: List assets
        run: ls -la release-assets

      # 如果 Release 已存在（如 tauri-action 之前创建的），先删除
      - name: Delete existing release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "$GITHUB_REPOSITORY" || true
          # 同时删除远端 tag（softprops 会重新创建）
          git push origin --delete "${{ github.ref_name }}" 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Dev Switch ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # Dev Switch ${{ github.ref_name }}

            > The first public release of **Dev Switch** — a Tauri-based desktop app that detects and displays your local development environment in one click: system info, 19 programming languages, 50+ development tools and network details, with per-OS install/uninstall guides, all cached in SQLite for instant subsequent launches. Available on Windows (macOS/Linux installers planned).

            **[中文版 →](https://github.com/gaoqiong001/dev-switch/blob/${{ github.ref_name }}/docs/release-notes/${{ github.ref_name }}-zh.md)** | **[Changelog](https://github.com/gaoqiong001/dev-switch/blob/${{ github.ref_name }}/CHANGELOG.md)**

            ---

            ## Highlights: What You Can Do Now

            - **One-click full inventory**: detect 19 languages and 50+ tools in a single scan; installed items are sorted to the front.
            - **Clean version output**: raw `--version` banners are cleaned to the version token (e.g. `curl 8.21.0 (Windows) …` → `8.21.0`).
            - **Per-OS install/uninstall guides**: every item includes the exact install/uninstall command for Windows, macOS, or Linux.
            - **System & network info**: OS, hostname, CPU, memory, plus local IP and network interfaces.
            - **Silent auto-update**: built-in updater downloads and installs new versions automatically (toggleable in Settings); falls back to opening the download page when disabled.
            - **Search, themes, export**: filter by name; light/dark/system themes; compact mode; export results as JSON/CSV.

            ---

            ## Overview

            Dev Switch is a local development-environment detection app. It scans the machine for installed runtimes and tools, reports clean version numbers and install paths, and opens the matching install/uninstall guide per platform. Detection results are cached in a bundled SQLite database, so subsequent launches are instant until you hit **Refresh**.

            **Release date**: 2026-08-10

            **Change size**: 7 commits | 70 files changed | +13,417 / -17 lines

            ---

            ## Added

            ### One-Click Environment Detection

            A single scan detects 19 programming languages and 50+ development tools installed on your machine. System information (OS version, hostname, CPU cores, total memory) and network details (local IP, network interfaces) are included. Installed items are always sorted to the front for quick identification.

            ### Clean Version Output

            Raw `--version` output is cleaned to the version token only. Multi-line banners (VS Code), banner text (curl), and version prefixes (v22.12.0) are all handled. The version cleaning works across 19 languages and 50+ tools without external regex dependencies.

            ### Per-OS Install and Uninstall Guides

            Every detected item includes platform-specific install and uninstall commands. Windows users get `winget` or `choco` commands, macOS users get `brew` commands, and Linux users get `apt-get` commands. Each guide is tailored to the specific tool.

            ### Silent Auto-Update

            A built-in updater checks for new versions on startup (when enabled in **Settings → Startup → Check for updates on startup**) and downloads and installs them silently via the Tauri updater. The feature is toggleable — when disabled, checking for updates opens the GitHub Release page for manual download. Semantic version comparison ensures correct upgrade detection.

            ### Search, Themes, and Export

            Filter languages and tools by name with the search bar. Switch between light, dark, or system-following themes. Compact mode reduces spacing for denser layouts. Export detection results as JSON or CSV, and import settings from a previous export.

            ### SQLite Cache

            Detection results are cached in a bundled SQLite database. Subsequent launches load from cache instantly. Hit **Refresh** to clear the cache and re-scan. The cache expiry is configurable in Settings.

            ---

            ## Upgrade Notes

            - **No upgrade path** — this is the first release; there is no previous version to upgrade from, and no database migration (schema is created fresh on first launch).
            - Updates from this version onward are delivered via the built-in silent updater; new versions are downloaded and installed automatically (toggleable in **Settings → Startup → Auto-download and install updates**).

            ---

            ## Download & Install

            Grab the installer for your system from the **Assets** section below.

            Windows:

            - `.exe` (NSIS installer)
            - `.msi` (MSI installer) — recommended for auto-update support

            > No console windows pop up during detection on Windows.

            ---

            ## License

            MIT © Gao Qiong
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 阶段 3：生成 latest.json + 上传到 Release ────────────────
  # 参考 cc-switch 的 assemble-latest-json job。
  # Tauri updater 读取此文件来判断是否有新版本、下载地址和签名。
  assemble-latest-json:
    name: Assemble latest.json
    runs-on: ubuntu-latest
    needs: publish-release
    permissions:
      contents: write
    steps:
      - name: Install gh CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y gh
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p dl
          gh release download "$TAG" --dir dl --repo "$GITHUB_REPOSITORY"
          ls -la dl

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          # 遍历 .sig 文件，构建 platform 映射
          WIN_URL=""; WIN_SIG=""
          shopt -s nullglob
          for sig in dl/*.sig; do
            fname=$(basename "${sig%.sig}")
            url="$BASE_URL/$fname"
            sig_content=$(cat "$sig")
            case "$fname" in
              *.msi)
                WIN_URL="$url"; WIN_SIG="$sig_content";;
            esac
          done

          # 构造 latest.json
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "Dev Switch $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              }
            }
          }
          EOF

          # 清理 JSON 中的缩进（去掉每行前导空格）
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('latest.json','utf8');
            const cleaned = raw.split('\n').map(l => l.replace(/^          /,'')).join('\n');
            fs.writeFileSync('latest.json', cleaned);
          "

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "✅ latest.json uploaded"
